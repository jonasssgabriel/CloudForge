syntax = "proto3";

package cloudforge;

option java_multiple_files = true;
option java_package = "com.mycompany.cloudforge";

// Serviço de nomes: diz ONDE estão os servidores (não faz health check nem balanceamento).
service NomesService {
  rpc Registrar(Instancia) returns (Resposta);
  rpc Desregistrar(Instancia) returns (Resposta);
  rpc Listar(Vazio) returns (ListaInstancias);

  // BÔNUS (histórico global compartilhado entre instâncias) - só usado com --global
  rpc RegistrarProcessamento(RegistroGlobal) returns (Resposta);
  rpc ObterHistoricoGlobal(Vazio) returns (HistoricoGlobal);
}

message Vazio {}

message Instancia {
  string id = 1;     // ex.: srv-50051
  string host = 2;   // ex.: localhost
  int32 porta = 3;   // ex.: 50051
}

message Resposta {
  bool ok = 1;
  string mensagem = 2;
}

message ListaInstancias {
  repeated Instancia instancias = 1;
}

// ---- Bônus ----
message RegistroGlobal {
  string instancia = 1;
  int64 idTarefa = 2;      // número local da instância (repete entre instâncias)
  string tipo = 3;
  string cliente = 4;
  int64 duracaoMs = 5;
  string horario = 6;
}

message HistoricoGlobal {
  int64 total = 1;
  repeated RegistroGlobal registros = 2;
}
